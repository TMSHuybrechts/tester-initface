<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Intiface verbindingstest</title><style>body{font:16px system-ui;background:#17111b;color:#f7edf6;max-width:640px;margin:35px auto;padding:18px}input,button{font:inherit;padding:13px;border-radius:10px;border:1px solid #a88b9c}input{width:100%;box-sizing:border-box;background:#302330;color:white}button{background:#d9a1ba;color:#21121d;margin:14px 0;font-weight:bold}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#302330;padding:14px;border-radius:10px;min-height:140px}small{color:#c9b6c4}</style></head><body><h1>Intiface verbindingstest</h1><p>Test uitsluitend de verbinding en protocolhandshake. Geen apparaatbeweging.</p><label for="url">WebSocket-adres</label><input id="url" value="ws://192.168.0.200:12345" autocapitalize="off" spellcheck="false"><button id="test">Test verbinding</button><pre id="log">Klaar om te testen.</pre><small>Open dit bestand bij voorkeur via een HTTPS-website. Bij een lokale bestandsopening kunnen browserregels anders zijn.</small><script>const out=document.getElementById('log');function log(s){out.textContent+='\n'+s}document.getElementById('test').onclick=()=>{out.textContent='Pagina: '+location.href+'\nBeveiligde context: '+isSecureContext+'\nVerbinding maken...';let ws;try{ws=new WebSocket(document.getElementById('url').value)}catch(e){log('Constructiefout: '+e.name+': '+e.message);return}let timer=setTimeout(()=>{log('Timeout na 8 seconden');ws.close()},8000);ws.onopen=()=>{log('WebSocket OPEN: verbinding geslaagd');ws.send(JSON.stringify([{RequestServerInfo:{ClientName:'iPhone Intiface Diagnostic',MessageVersion:3,Id:1}}]));log('RequestServerInfo verzonden')};ws.onmessage=e=>{log('Antwoord: '+e.data);clearTimeout(timer);ws.close()};ws.onerror=e=>log('WebSocket ERROR (browser geeft geen gedetailleerde oorzaak): '+e.type);ws.onclose=e=>{clearTimeout(timer);log('CLOSE code='+e.code+' reason='+e.reason+' clean='+e.wasClean)}};</script></body></html>
